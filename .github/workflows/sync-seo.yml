name: Synchroniser le SEO avec content.json

# Quand content.json change (par exemple les horaires modifiés depuis GitHub),
# régénère le bloc SEO de index.html (horaires Google, adresse, téléphone...)
# puis le commite (ce qui republie le site).
on:
  push:
    branches: [master]
    paths: [content.json, index.html, script.js, styles.css, 'img/**', tools/sync_seo.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-seo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # date du dernier changement pour sitemap.xml

      - name: Régénérer le bloc SEO depuis content.json
        run: python3 tools/sync_seo.py

      - name: Enregistrer et republier si quelque chose a changé
        run: |
          if git diff --quiet index.html sitemap.xml; then
            echo "Déjà à jour, rien à faire."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Synchroniser le SEO avec content.json"
          git push   # ce push relance automatiquement la publication GitHub Pages
